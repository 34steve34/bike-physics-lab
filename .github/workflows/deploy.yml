name: Build and publish Bike Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bike-lab-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'
          no-cache: true
      - name: Check browser code
        run: npm run check
      - name: Compile original C, test native and browser physics
        run: bash scripts/build.sh
      - name: Publish tested browser files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: 'Publish tested Bike Lab'
